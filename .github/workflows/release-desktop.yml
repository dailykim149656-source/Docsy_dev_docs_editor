name: Release Desktop Apps

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-15-intel
          - label: Linux
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop renderer and Electron entry
        run: |
          npm run build
          npm run electron:build

      - name: Package desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts
          find release -maxdepth 1 -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.zip" \
          \) -exec cp {} desktop-artifacts/ \;
          ls -la desktop-artifacts
          test "$(find desktop-artifacts -type f | wc -l)" -gt 0

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: desktop-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -la release-assets
          if gh release view "${RELEASE_TAG}" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --repo "${RELEASE_REPO}" --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --repo "${RELEASE_REPO}" \
              --latest \
              --title "Docsy Desktop ${RELEASE_TAG}" \
              --notes "Local-first Docsy desktop builds for Windows, macOS, and Linux."
          fi
